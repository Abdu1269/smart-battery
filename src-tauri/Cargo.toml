[package]
name = "batterybloom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Calm battery health, charging alerts, and power guidance"
default-run = "batterybloom"

[lib]
name = "batterybloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "batterybloom"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
batterybloom-core = { path = "../crates/batterybloom-core" }
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror.workspace = true
tokio = { version = "1", features = ["time", "sync"] }
