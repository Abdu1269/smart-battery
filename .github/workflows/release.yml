name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish immediately instead of creating a draft release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check package, Tauri, and Cargo versions
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(node -e '
            const fs = require("fs");
            const manifest = fs.readFileSync("Cargo.toml", "utf8");
            const match = manifest.match(/\[workspace\.package\][\s\S]*?\bversion\s*=\s*"([^"]+)"/);
            if (!match) process.exit(1);
            process.stdout.write(match[1]);
          ')

          if [[ "$version" != "$tauri_version" || "$version" != "$cargo_version" ]]; then
            echo "::error::Version mismatch: package.json=$version tauri.conf.json=$tauri_version Cargo.toml=$cargo_version"
            exit 1
          fi

          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $tag"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA"

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            args: "--bundles deb,appimage"
          - name: windows-x64
            os: windows-latest
            args: "--bundles nsis"
          - name: macos-universal
            os: macos-latest
            args: "--bundles dmg --target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf xdg-utils \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing certificate
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "No APPLE_CERTIFICATE configured; the DMG will use an ad-hoc signature."
            exit 0
          fi

          keychain_password=$(openssl rand -hex 16)
          certificate_path="$RUNNER_TEMP/batterybloom-signing.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"

          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$certificate_path" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" build.keychain

          identity=$(security find-identity -v -p codesigning build.keychain \
            | sed -n 's/.*"\(.*\)"/\1/p' | head -1)
          if [[ -z "$identity" ]]; then
            echo "::error::The Apple certificate was imported but no code-signing identity was found."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Using Apple signing identity: $identity"

      - name: Configure Apple notarization
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [[ -n "${APPLE_ID_SECRET:-}" && -n "${APPLE_PASSWORD_SECRET:-}" && -n "${APPLE_TEAM_ID_SECRET:-}" ]]; then
            {
              echo "APPLE_ID=$APPLE_ID_SECRET"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"
            } >> "$GITHUB_ENV"
            echo "Apple notarization credentials configured."
          else
            echo "No Apple notarization credentials configured; skipping notarization."
          fi

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: BatteryBloom ${{ needs.verify.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            BatteryBloom ${{ needs.verify.outputs.version }} is a local-first battery
            health, charging, and power utility.

            Downloads:
            - Linux: `.deb` and `.AppImage`
            - Windows: `.exe` installer (NSIS)
            - macOS: universal `.dmg` (Apple Silicon and Intel)

            The Windows NSIS installer is not code-signed, so SmartScreen may warn.
            The macOS DMG is Developer ID signed and notarised when Apple signing
            secrets are configured; otherwise it uses an ad-hoc signature and
            Gatekeeper may require manual approval.

            SHA256 checksums are uploaded as `SHA256SUMS.txt` after the build finishes.
            Verify downloads against that file before installing.
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 3
          args: ${{ matrix.args }}

  checksums:
    name: Add SHA256 checksums
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release assets and upload SHA256SUMS.txt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern '*.deb' \
            --pattern '*.AppImage' \
            --pattern '*.exe' \
            --pattern '*.dmg'

          cd release-assets
          find . -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
