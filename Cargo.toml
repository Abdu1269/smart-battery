[workspace]
resolver = "2"
members = ["crates/batterybloom-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
authors = ["BatteryBloom contributors"]

[workspace.dependencies]
battery = { package = "starship-battery", version = "0.12.0" }
chrono = { version = "0.4.42", features = ["clock", "serde"] }
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
